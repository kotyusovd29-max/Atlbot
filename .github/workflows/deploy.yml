name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check SSH key secret
        env:
          SSH_KEY: ${{ secrets.F5_SSH_KEY }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo "Секрет F5_SSH_KEY пустой. Добавьте приватный ключ ~/.ssh/f5_team целиком."
            exit 1
          fi
          if ! printf '%s\n' "$SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "Секрет F5_SSH_KEY не похож на приватный ключ (нет строки BEGIN ... PRIVATE KEY)."
            echo "Нужен файл ~/.ssh/f5_team целиком, включая BEGIN и END."
            exit 1
          fi
          echo "Ключ найден, длина ${#SSH_KEY} символов."
          if [ -z "${{ secrets.F5_SSH_PASSPHRASE }}" ]; then
            echo "Секрет F5_SSH_PASSPHRASE пустой. Ключ f5_team защищён паролем — добавьте этот пароль в секрет."
            exit 1
          fi
          echo "Пароль ключа задан."

      - name: Copy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          source: "app.py,index.html"
          target: /home/kotusov/projects/pr1
          overwrite: true

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          command_timeout: 60s
          script: |
            mkdir -p /home/kotusov/projects/pr1
            python3 - << 'PY'
            import os, signal
            me, parent = os.getpid(), os.getppid()
            inodes = set()
            for fn in ("/proc/net/tcp", "/proc/net/tcp6"):
                try:
                    lines = open(fn).read().splitlines()[1:]
                except Exception:
                    continue
                for line in lines:
                    parts = line.split()
                    local, state, inode = parts[1], parts[3], parts[9]
                    if state == "0A" and local.rsplit(":", 1)[-1].upper() == "1F40":
                        inodes.add(inode)
            for name in os.listdir("/proc"):
                if not name.isdigit():
                    continue
                pid = int(name)
                if pid in (me, parent):
                    continue
                fd_dir = "/proc/%d/fd" % pid
                try:
                    fds = os.listdir(fd_dir)
                except Exception:
                    continue
                for fd in fds:
                    try:
                        target = os.readlink("%s/%s" % (fd_dir, fd))
                    except Exception:
                        continue
                    if target.startswith("socket:[") and target[8:-1] in inodes:
                        os.kill(pid, signal.SIGTERM)
                        break
            PY
            sleep 1
            cd /home/kotusov/projects/pr1
            python3 -c 'import subprocess; subprocess.Popen(["/usr/bin/python3","app.py"], cwd="/home/kotusov/projects/pr1", start_new_session=True, stdin=subprocess.DEVNULL, stdout=open("/home/kotusov/projects/pr1/server.log","a"), stderr=subprocess.STDOUT)'
            (crontab -l 2>/dev/null | grep -v "pr1-wheel" || true; echo "@reboot sleep 8 && cd /home/kotusov/projects/pr1 && /usr/bin/python3 app.py >> /home/kotusov/projects/pr1/server.log 2>&1 # pr1-wheel") | crontab -
            sleep 1
            curl -sf -o /dev/null -w "app:%{http_code}\n" http://127.0.0.1:8000/
