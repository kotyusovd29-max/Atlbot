name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check SSH key secret
        env:
          SSH_KEY: ${{ secrets.F5_SSH_KEY }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo "Секрет F5_SSH_KEY пустой. Добавьте приватный ключ ~/.ssh/f5_team целиком."
            exit 1
          fi
          if ! printf '%s\n' "$SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "Секрет F5_SSH_KEY не похож на приватный ключ (нет строки BEGIN ... PRIVATE KEY)."
            echo "Нужен файл ~/.ssh/f5_team целиком, включая BEGIN и END."
            exit 1
          fi
          echo "Ключ найден, длина ${#SSH_KEY} символов."
          if [ -z "${{ secrets.F5_SSH_PASSPHRASE }}" ]; then
            echo "Секрет F5_SSH_PASSPHRASE пустой. Ключ f5_team защищён паролем — добавьте этот пароль в секрет."
            exit 1
          fi
          echo "Пароль ключа задан."

      - name: Copy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          source: "app.py,index.html,run.sh"
          target: /home/kotusov/projects/pr1
          overwrite: true

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          command_timeout: 90s
          script: |
            mkdir -p /home/kotusov/projects/pr1
            bash /home/kotusov/projects/pr1/run.sh
            (crontab -l 2>/dev/null | grep -v "pr1-wheel" || true; echo "@reboot sleep 8 && bash /home/kotusov/projects/pr1/run.sh >> /home/kotusov/projects/pr1/server.log 2>&1 # pr1-wheel") | crontab -
