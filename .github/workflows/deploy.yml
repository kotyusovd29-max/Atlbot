name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to f5 server
        env:
          SSH_KEY: ${{ secrets.F5_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/f5_team
          chmod 600 ~/.ssh/f5_team
          ssh-keyscan -H 89.169.3.47 >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -o IdentitiesOnly=yes -o ConnectTimeout=20 -i ~/.ssh/f5_team kotusov@89.169.3.47"
          SCP="scp -o IdentitiesOnly=yes -o ConnectTimeout=20 -i ~/.ssh/f5_team"
          $SSH 'mkdir -p /home/kotusov/projects/pr1'
          $SCP app.py index.html kotusov@89.169.3.47:/home/kotusov/projects/pr1/
          $SSH 'set -e
            pkill -f "projects/pr1/app.py" 2>/dev/null || true
            pkill -f "http.server 8000" 2>/dev/null || true
            sleep 1
            cd /home/kotusov/projects/pr1
            python3 -c "import os,subprocess; subprocess.Popen([\"/usr/bin/python3\",\"app.py\"], start_new_session=True, stdin=subprocess.DEVNULL, stdout=open(\"server.log\",\"a\"), stderr=subprocess.STDOUT)"
            (crontab -l 2>/dev/null | grep -v "projects/pr1"; echo "@reboot sleep 8 && cd /home/kotusov/projects/pr1 && /usr/bin/python3 app.py >> /home/kotusov/projects/pr1/server.log 2>&1") | crontab -
            sleep 1
            curl -sf -o /dev/null -w "app:%{http_code}\n" http://127.0.0.1:8000/'
