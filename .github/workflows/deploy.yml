name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          SSH_KEY: ${{ secrets.F5_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo "Секрет F5_SSH_KEY пустой. Добавьте приватный ключ ~/.ssh/f5_team целиком."
            exit 1
          fi
          if ! printf '%s\n' "$SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "Секрет F5_SSH_KEY не похож на приватный ключ (нет строки BEGIN ... PRIVATE KEY)."
            echo "Нужен файл ~/.ssh/f5_team целиком, включая BEGIN и END."
            exit 1
          fi
          echo "Ключ найден, длина ${#SSH_KEY} символов."
          if [ -z "${{ secrets.F5_SSH_PASSPHRASE }}" ]; then
            echo "Секрет F5_SSH_PASSPHRASE пустой. Ключ f5_team защищён паролем — добавьте этот пароль в секрет."
            exit 1
          fi
          echo "Пароль ключа задан."
          if [ -z "$BOT_TOKEN" ]; then
            echo "Секрет BOT_TOKEN пустой. Страница откроется, бот не запустится, пока секрет не добавят и деплой не повторят."
          else
            echo "BOT_TOKEN задан, длина ${#BOT_TOKEN}."
          fi

      - name: Wipe old project once
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          command_timeout: 60s
          script: |
            set -e
            if [ -f /home/kotusov/projects/pr1/.ttn ]; then
              echo "TTN data exists, keep database and uploads"
              exit 0
            fi
            python3 << 'PY'
            import os, signal, time
            me, parent = os.getpid(), os.getppid()

            def stop(sig):
                for name in os.listdir("/proc"):
                    if not name.isdigit():
                        continue
                    pid = int(name)
                    if pid in (me, parent):
                        continue
                    try:
                        raw = open("/proc/%d/cmdline" % pid, "rb").read().replace(b"\0", b" ").decode()
                    except Exception:
                        continue
                    if "/home/kotusov/projects/pr1/app.py" in raw or ("http.server" in raw and "8000" in raw):
                        try:
                            os.kill(pid, sig)
                            print("stopped", pid, sig)
                        except Exception as exc:
                            print("cannot stop", pid, exc)

            stop(signal.SIGTERM)
            time.sleep(1)
            stop(signal.SIGKILL)
            PY
            mkdir -p /home/kotusov/projects/pr1
            find /home/kotusov/projects/pr1 -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            echo wiped

      - name: Copy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          source: "app.py,index.html,run.sh"
          target: /home/kotusov/projects/pr1
          overwrite: true

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.2
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          host: 89.169.3.47
          username: kotusov
          key: ${{ secrets.F5_SSH_KEY }}
          passphrase: ${{ secrets.F5_SSH_PASSPHRASE }}
          port: 22
          timeout: 40s
          command_timeout: 120s
          envs: BOT_TOKEN
          script: |
            set -e
            mkdir -p /home/kotusov/projects/pr1
            bash /home/kotusov/projects/pr1/run.sh
            (crontab -l 2>/dev/null | grep -v "pr1-wheel" || true; echo "@reboot sleep 8 && bash /home/kotusov/projects/pr1/run.sh >> /home/kotusov/projects/pr1/server.log 2>&1 # pr1-wheel") | crontab -
