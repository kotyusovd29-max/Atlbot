<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Пакеты документов ТТН</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --card: #fffdf8;
      --ink: #1d1a16;
      --muted: #6d655c;
      --line: #e4dccf;
      --accent: #9a4d24;
      --wait: #8a5a12;
      --ok: #1f6b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    h1 { margin: 0 0 6px; font-size: 28px; font-weight: 650; }
    .lead { margin: 0; color: var(--muted); }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin: 20px 0;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    select, input, button {
      font: inherit;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 180px;
    }
    button { cursor: pointer; background: var(--ink); color: white; border-color: var(--ink); }
    .cards { display: grid; gap: 16px; padding-bottom: 40px; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .who { font-size: 18px; font-weight: 650; }
    .user { color: var(--muted); font-weight: 400; }
    .when { color: var(--muted); }
    .chip {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #f3e7d2;
      color: var(--wait);
    }
    .chip.done { background: #e5f3eb; color: var(--ok); }
    .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .doc {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 140px;
      background: #fff;
    }
    .doc h2 { margin: 0 0 8px; font-size: 15px; }
    img { max-width: 100%; border-radius: 8px; display: block; }
    a { color: var(--accent); }
    .wait { color: var(--muted); }
    .empty { color: var(--muted); padding: 12px 0 32px; }
    .err { color: #8d2b2b; }
    @media (max-width: 720px) {
      .docs { grid-template-columns: 1fr; }
      select, input, button { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Пакеты документов ТТН</h1>
    <p class="lead">ТТН погрузки и ТТН отгрузки, которые водители присылают в бота.</p>
  </header>
  <main>
    <form id="filters">
      <label>Водитель
        <select id="driver" name="driver">
          <option value="">Все водители</option>
        </select>
      </label>
      <label>Дата
        <input id="date" name="date" type="date">
      </label>
      <button type="button" id="reset">Сбросить</button>
    </form>
    <p id="status" class="lead"></p>
    <div id="cards" class="cards"></div>
  </main>
  <script>
    const driverSelect = document.getElementById("driver");
    const dateInput = document.getElementById("date");
    const cards = document.getElementById("cards");
    const status = document.getElementById("status");
    let lastPayload = "";
    let requestSeq = 0;

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function renderDoc(title, file) {
      const box = el("section", null, "doc");
      box.appendChild(el("h2", title));
      if (!file) {
        box.appendChild(el("p", "Ожидается", "wait"));
        return box;
      }
      if (file.preview && typeof file.url === "string" && file.url.indexOf("/files/") === 0) {
        const img = document.createElement("img");
        img.src = file.url;
        img.alt = title;
        box.appendChild(img);
      }
      const link = document.createElement("a");
      link.href = file.url;
      link.textContent = file.name || "Скачать";
      link.target = "_blank";
      link.rel = "noopener";
      if (!file.preview) box.appendChild(link);
      else {
        const note = el("p");
        note.appendChild(link);
        box.appendChild(note);
      }
      return box;
    }

    function render(data) {
      const selected = driverSelect.value;
      driverSelect.replaceChildren(el("option", "Все водители"));
      driverSelect.firstChild.value = "";
      (data.drivers || []).forEach(function (driver) {
        const label = driver.username ? driver.name + " (@" + driver.username + ")" : driver.name;
        const option = el("option", label);
        option.value = String(driver.id);
        driverSelect.appendChild(option);
      });
      driverSelect.value = [...driverSelect.options].some(function (o) { return o.value === selected; }) ? selected : "";

      cards.replaceChildren();
      const items = data.packages || [];
      status.textContent = items.length ? ("Пакетов: " + items.length) : "";
      if (!items.length) {
        cards.appendChild(el("p", "Пакетов пока нет.", "empty"));
        return;
      }
      items.forEach(function (item) {
        const card = document.createElement("article");
        const top = el("div", null, "top");
        const who = el("div");
        const name = el("div", item.driver_name, "who");
        if (item.driver_username) {
          name.appendChild(el("span", " @" + item.driver_username, "user"));
        }
        who.appendChild(name);
        const chip = el("span", item.status === "complete" ? "Оба документа" : "Ждём отгрузку", "chip");
        if (item.status === "complete") chip.classList.add("done");
        who.appendChild(chip);
        top.appendChild(who);
        top.appendChild(el("div", item.date_label + " " + item.time_label, "when"));
        card.appendChild(top);
        const docs = el("div", null, "docs");
        docs.appendChild(renderDoc("ТТН погрузки", item.loading));
        docs.appendChild(renderDoc("ТТН отгрузки", item.unloading));
        card.appendChild(docs);
        cards.appendChild(card);
      });
    }

    function load() {
      const ticket = ++requestSeq;
      const params = new URLSearchParams();
      if (driverSelect.value) params.set("driver", driverSelect.value);
      if (dateInput.value) params.set("date", dateInput.value);
      const qs = params.toString();
      fetch("/api/packages" + (qs ? "?" + qs : ""))
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (ticket !== requestSeq) return;
          if (!data.ok) throw new Error("bad");
          const key = JSON.stringify(data);
          if (key === lastPayload) return;
          lastPayload = key;
          render(data);
        })
        .catch(function () {
          if (ticket !== requestSeq) return;
          lastPayload = "";
          status.textContent = "Не удалось загрузить пакеты.";
        });
    }

    driverSelect.addEventListener("change", load);
    dateInput.addEventListener("change", load);
    document.getElementById("reset").addEventListener("click", function () {
      driverSelect.value = "";
      dateInput.value = "";
      load();
    });
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
